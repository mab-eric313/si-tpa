<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="{{ url_for('static', path='/static/styles/style.css') }}">
	<title>Sistem Informasi TPA</title>
</head>
<body>

		<ul class="nav-sidebar">
			<div class="nav-sidebar-main">
				<li class="logo">

				</li>
				<li class="nav-sidebar-item">
					<img src="{{ url_for('static', path='static/assets/home.svg') }}">
					<a href="#dashboard" class="active">Dashboard</a></li>
				<li class="nav-sidebar-item">
					<img src="{{ url_for('static', path='static/assets/persons.svg') }}">

				<li class="nav-sidebar-item">

				<li id="profile">

				</li>
				<li id="logout" class="nav-sidebar-item">
					<img src="{{ url_for('static', path='static/assets/exit.svg') }}">

				</li>
			</div>

</html>
