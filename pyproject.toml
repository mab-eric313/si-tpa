[project]
name = "SI-TPA"
description = "Website Sistem Informasi untuk Taman Pendidikan Al-Quran"
readme = "README.md"
requires-python = ">=3.13"
version = "0.1.0"
authors = [
	{name = "Eric Al Busyiri", email = "kseneric313@gmail.com"}
]
dependencies = [
	"fastapi>=0.136.3",
	"uvicorn>=0.49.0",
	"dotenv>=0.9.9",
	"starlette>=1.2.1",
	"pytest>=9.0.3",
	"keyring>=25.7.0",
	"sqlalchemy>=2.0.50",
	"asyncmy>=0.2.11",
	"pydantic>=2.13.4",
	"pydantic-core>=2.47.0",
]

[tool.setuptools]
packages = ["backend", "backend.app", "backend.app.routers", "backend.app.tests"]

[tool.poetry]
package-mode = false
